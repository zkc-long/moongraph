<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MoonGraph: examples\\people.jsonl</title>
<style>
body{font-family:ui-sans-serif,system-ui,sans-serif;margin:0;background:#0f1115;color:#e6e6e6}
header{padding:16px 20px;border-bottom:1px solid #262b36}
h1{font-size:16px;margin:0 0 4px 0;font-weight:600}
#meta{font-size:12px;color:#8b93a7}
svg{display:block;width:100vw;height:calc(100vh - 70px)}
line{stroke:#3a4152;stroke-width:1}
circle{fill:#4c8dff;stroke:#0f1115;stroke-width:1.5}
text{fill:#c9d1e3;font-size:9px;font-family:ui-monospace,monospace;paint-order:stroke;stroke:#0f1115;stroke-width:2px}
</style>
</head>
<body>
<header>
<h1>MoonGraph: examples\\people.jsonl</h1>
<div id="meta"></div>
</header>
<svg id="g"></svg>
<script>
const DATA = {"nodes":[{"id":0,"label":"Ada"},{"id":1,"label":"Bob"},{"id":2,"label":"Cy"},{"id":3,"label":"Acme"}],"edges":[{"source":0,"target":1,"type":"KNOWS"},{"source":1,"target":2,"type":"KNOWS"},{"source":0,"target":3,"type":"WORKS_AT"},{"source":1,"target":3,"type":"WORKS_AT"},{"source":2,"target":3,"type":"WORKS_AT"}]};
const W = window.innerWidth, H = window.innerHeight - 70;
const svg = document.getElementById('g');
document.getElementById('meta').textContent =
  DATA.nodes.length + ' nodes · ' + DATA.edges.length + ' relationships';
const byId = new Map(DATA.nodes.map((n, i) => [n.id, i]));
DATA.nodes.forEach((n, i) => {
  const a = (i / Math.max(1, DATA.nodes.length)) * Math.PI * 2;
  n.x = W / 2 + Math.cos(a) * Math.min(W, H) * 0.35 + (i % 7) * 3;
  n.y = H / 2 + Math.sin(a) * Math.min(W, H) * 0.35 + (i % 5) * 3;
  n.vx = 0; n.vy = 0;
});
const links = DATA.edges
  .filter(e => byId.has(e.source) && byId.has(e.target))
  .map(e => ({a: byId.get(e.source), b: byId.get(e.target), type: e.type}));
const N = DATA.nodes.length;
for (let tick = 0; tick < 260; tick++) {
  const k = tick < 200 ? 0.02 : 0.004;
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      const a = DATA.nodes[i], b = DATA.nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy + 0.01;
      if (d2 > 90000) continue;
      const f = 2200 / d2;
      const d = Math.sqrt(d2);
      a.vx += (dx / d) * f; a.vy += (dy / d) * f;
      b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
    }
  }
  for (const l of links) {
    const a = DATA.nodes[l.a], b = DATA.nodes[l.b];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) + 0.01;
    const f = (d - 90) * 0.012;
    a.vx += (dx / d) * f; a.vy += (dy / d) * f;
    b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
  }
  for (const n of DATA.nodes) {
    n.vx += (W / 2 - n.x) * 0.002; n.vy += (H / 2 - n.y) * 0.002;
    n.x += n.vx * k; n.y += n.vy * k;
    n.vx *= 0.6; n.vy *= 0.6;
    n.x = Math.max(20, Math.min(W - 20, n.x));
    n.y = Math.max(20, Math.min(H - 20, n.y));
  }
}
const NS = 'http://www.w3.org/2000/svg';
for (const l of links) {
  const a = DATA.nodes[l.a], b = DATA.nodes[l.b];
  const ln = document.createElementNS(NS, 'line');
  ln.setAttribute('x1', a.x); ln.setAttribute('y1', a.y);
  ln.setAttribute('x2', b.x); ln.setAttribute('y2', b.y);
  svg.appendChild(ln);
}
for (const n of DATA.nodes) {
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', 4);
  svg.appendChild(c);
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', n.x + 7); t.setAttribute('y', n.y + 3);
  t.textContent = n.label;
  svg.appendChild(t);
}
</script>
</body>
</html>
