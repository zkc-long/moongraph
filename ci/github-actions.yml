name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build, test and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version

      - name: Build
        run: moon build --target native

      - name: Test
        run: moon test

      - name: openCypher TCK subset
        run: moon run cmd/tck -- conformance/features/*.feature

      - name: Upload TCK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tck-report
          path: conformance/report.md
